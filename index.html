<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Highway Rush 3D</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Game Canvas -->
    <div id="game"></div>

    <!-- Loading Screen -->
    <div id="loading">
        <h1>HIGHWAY RUSH 3D</h1>
        <p>Loading...</p>
    </div>

    <!-- Game HUD -->
    <div id="hud">

        <div class="speed">
            <span id="speed">0</span>
            <small>KM/H</small>
        </div>

        <div class="coins">
            🪙 <span id="coins">0</span>
        </div>

    </div>

    <!-- Three.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js">
    </script>

    <!-- Game JavaScript -->
    <script src="js/main.js"></script>

</body>
</html>
